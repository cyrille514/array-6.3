<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>
  <script src="./js/app.js" defer></script>

  <style type="text/tailwindcss">
    @import "tailwindcss"; 

    @layer base {
      :root {
        @apply text-sm;
        line-height: 1.6;
      }
      }
   </style>

</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md mt-12 mb-12 rounded-[2.5rem] shadow-2xl overflow-hidden pb-8">
        
        <div class="bg-green-400 text-white text-center py-8 rounded-b-[1.5rem]">
            <h1 class="text-3xl font-bold tracking-tight">Tareas</h1>
            
        </div>

        <div class="px-8 pt-6">
            <!-- Formulario de entrada -->
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-800 mb-1 uppercase tracking-wider">Tareas</label>
                    <input id="taskInput" type="text" placeholder="Ej: Entra la tarea..." 
                           class="w-full p-3 bg-gray-50 border border-gray-400 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-gray-800 mb-1 uppercase tracking-wider">Importancia</label>
                        <select id="importanceInput" class="w-full p-3 bg-gray-50 border border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                            <option value="urgente">Urgente</option>
                            <option value="alta">Alta</option>
                            <option value="media">Media</option>
                            <option value="baja">Baja</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-800 mb-1 uppercase tracking-wider">Fecha Tope</label>
                        <input id="dateInput" type="date" class="w-full p-3 bg-gray-50 border border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex flex-col gap-3">
                <button onclick="addTask()" class="w-full py-4 bg-[#6343ED] text-white font-bold rounded-xl shadow-[0_4px_0_#4c32bc] active:translate-y-1 active:shadow-none transition-all">
                    Añadir Tarea
                </button>
                <button onclick="renderTasks()" class="w-full py-4 bg-[#0DBA73] text-white font-bold rounded-xl shadow-[0_4px_0_#0a955c] active:translate-y-1 active:shadow-none transition-all">
                    Mostrar Tareas
                </button>
                <button onclick="deleteLastTask()" class="w-full py-4 bg-[#FFAE1A] text-white font-bold rounded-xl shadow-[0_4px_0_#d99314] active:translate-y-1 active:shadow-none transition-all">
                    Eliminar Tarea
                </button>
                <button onclick="exitApp()" class="w-full py-4 bg-[#1E293B] text-white font-bold rounded-xl shadow-[0_4px_0_#0f172a] active:translate-y-1 active:shadow-none transition-all">
                    Salir de la aplicación
                </button>
            </div>

            <!-- Lista de Tareas -->
            <div id="taskList" class="mt-8 space-y-3"></div>
        </div>
    </div>

    
</body>
</html>
